# Teleplex Payload CMS — Local Development Compose
#
# Use this to build and test the image locally before pushing to GHCR.
# On first run, visit http://localhost:3000/admin and create an admin user.
#
#   docker compose up --build -d
#   docker compose logs -f
#
# The SQLite database is persisted in a local bind-mounted directory.

services:
  payload:
    build:
      context: ../../..
      dockerfile: sites/teleplex/payload/Dockerfile
    container_name: teleplex-payload
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Match file ownership to your host user (optional)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/app/sites/teleplex/payload/data
    restart: unless-stopped
